trigger: none
pr: none

parameters:
  - name: appBranch
    displayName: Rama de demo-app-trigger
    type: string
    default: develop

resources:
  repositories:
    - repository: appSource
      type: git
      name: agony/demo-app-trigger
      endpoint: sc-ado-daroverodck-read
      ref: ${{ format('refs/heads/{0}', parameters.appBranch) }}

pool:
  vmImage: ubuntu-latest

steps:
  - checkout: self
    displayName: Checkout del YAML en GitHub

  - checkout: appSource
    displayName: Checkout de la rama seleccionada
    path: s/application

  - bash: |
      set -euo pipefail
      echo "Branch solicitada: ${{ parameters.appBranch }}"
      echo "Ref resuelta: $(resources.appSource.ref)"
      echo "Commit resuelto: $(resources.appSource.version)"
      git branch --show-current
      git log -1 --oneline
    workingDirectory: $(Pipeline.Workspace)/s/application
    displayName: Validar rama y commit

  - bash: |
      set -euo pipefail
      python3 -m unittest discover -v
      python3 app.py
    workingDirectory: $(Pipeline.Workspace)/s/application
    displayName: Probar aplicación
